<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coursera Automation</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      /* Deep slate/navy dark theme */
      --bg: #090B14;
      --bg-glass: rgba(18, 22, 38, 0.6);
      --bg-card: rgba(26, 32, 53, 0.8);
      
      /* Glowing Gradients */
      --grad-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --grad-magic: linear-gradient(135deg, #10b981 0%, #059669 100%);
      
      /* Accents */
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.06);
      --border-glow: rgba(99, 102, 241, 0.3);
      
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-text: #f87171;
    }

    body {
      width: 360px;
      margin: 0;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
      min-height: 400px;
      overflow-x: hidden;
    }

    .shell {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .logo-container {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      position: relative;
    }

    .logo-container::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 14px;
      background: var(--grad-primary);
      z-index: -1;
      filter: blur(8px);
      opacity: 0.5;
    }

    .logo-container svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .header-text h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Status Card (Glassmorphism) */
    .status-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }
    
    .status-card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 8px 32px rgba(79, 70, 229, 0.15);
    }

    .status-header {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6366f1;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-header::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6366f1;
      box-shadow: 0 0 8px #6366f1;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .status-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .status-label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
    }

    .status-val {
      font-weight: 600;
      font-family: 'Inter', monospace;
      font-size: 11px;
      color: #e2e8f0;
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-val.highlight {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    /* Alert */
    .alert {
      padding: 12px;
      border-radius: 8px;
      background: var(--error-bg);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error-text);
      font-size: 12px;
      font-weight: 500;
      display: none;
      line-height: 1.4;
      animation: slideDown 0.3s ease;
    }

    /* Buttons */
    .btn {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: var(--grad-primary);
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
    }

    .btn-magic {
      background: var(--grad-magic);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
    }
    .btn-magic:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    
    /* Pulse effect for Magic button */
    .btn-magic::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      animation: pulseMagic 2s infinite;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-outline:hover:not(:disabled) {
      background: rgba(255,255,255,0.03);
      color: var(--text);
    }

    /* SVG Icons */
    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    .btn.loading .spinner {
      display: block;
    }
    .btn.loading .btn-icon {
      display: none;
    }

    /* Progress UI */
    .progress-container {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      animation: slideDown 0.3s ease;
    }

    .progress-text {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 0%;
      transition: width 0.3s ease;
      position: relative;
    }
    
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    /* Messages */
    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: rgba(255,255,255,0.1);
      margin-bottom: 12px;
    }
    .empty-state p {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      opacity: 0.6;
      margin-top: 4px;
    }

    /* Animations */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulseMagic {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="shell">
    
    <div class="header">
      <div class="logo-container">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
      </div>
      <div class="header-text">
        <h1>Coursera Automation</h1>
        <p>Premium Learning Assistant</p>
      </div>
    </div>

    <div id="result-alert" class="alert"></div>

    <div id="page-status" class="status-card" style="display: none;">
      <div class="status-header">HỆ THỐNG PHÂN TÍCH</div>
      <div class="status-row">
        <span class="status-label">Loại bài học</span>
        <span class="status-val highlight" id="lbl-type">--</span>
      </div>
      <div class="status-row">
        <span class="status-label">Mã Item (ID)</span>
        <span class="status-val" id="lbl-item">--</span>
      </div>
      <div class="status-row">
        <span class="status-label">Khóa học</span>
        <span class="status-val" id="lbl-course">--</span>
      </div>
    </div>

    <div id="empty-msg" class="empty-state" style="display: none;">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <p>Vui lòng mở một trang bài học Coursera để hệ thống bắt đầu phân tích.</p>
    </div>

    <div class="actions" id="action-buttons" style="display: none;">
      <button id="btn-skip-current" class="btn btn-primary" style="margin-bottom: 10px;">
        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M13 3v6h8V3h-8zm0 18h8V11h-8v10zM3 21h8v-6H3v6zm0-8h8V3H3v10z"/></svg>
        <div class="spinner"></div>
        <span class="btn-text">Hoàn thành bài hiện tại</span>
      </button>

      <button id="btn-skip-all" class="btn btn-magic" style="margin-bottom: 10px;">
        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19.36 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.64-4.96zM13 13v4h-2v-4H8l4-4 4 4h-3z"/></svg>
        <div class="spinner"></div>
        <span class="btn-text">Hoàn thành toàn bộ khóa học</span>
      </button>

      <button id="btn-refresh" class="btn btn-outline">
        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span class="btn-text">Làm mới hệ thống</span>
      </button>
    </div>

    <!-- Animated Progress Bar UI -->
    <div id="bulk-progress-container" class="progress-container">
      <div class="progress-text">
        <span id="bulk-progress-msg">Khởi tạo dữ liệu...</span>
        <span id="bulk-progress-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="bulk-progress-bar" class="progress-bar-fill"></div>
      </div>
    </div>

    <div class="footer">
      Lưu ý: Chỉ áp dụng khi bạn đã ghi danh (Enroll) khóa học.
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
