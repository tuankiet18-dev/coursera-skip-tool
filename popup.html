<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coursera Skip</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --grad-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --grad-magic: linear-gradient(135deg, #10b981 0%, #059669 100%);
      
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --error: #f87171;
      --error-bg: rgba(239, 68, 68, 0.12);
      --amber: #facc15;
    }

    body {
      width: 320px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
      user-select: none;
      overflow: hidden;
    }

    .shell {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--grad-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 14px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .lang-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .lang-pill .active-text {
      color: #818cf8;
      font-weight: 700;
    }

    /* Alerts */
    .alert {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      display: none;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }

    /* Active Lesson Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #10b981;
      margin-bottom: 8px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: pulse 1.8s infinite;
    }

    .course-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 8px;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lesson-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .meta-label {
      color: var(--text-subtle);
      font-size: 11px;
    }

    .type-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    /* Clean Empty / Waiting State */
    .empty-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818cf8;
      font-size: 20px;
    }

    .empty-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .empty-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
      max-width: 250px;
    }

    /* Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 10px 12px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: var(--grad-primary);
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.25);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-magic {
      background: var(--grad-magic);
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.2);
    }
    .btn-magic:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 12px;
      margin-top: 4px;
    }
    .btn-outline:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
    }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    .btn.loading .spinner { display: block; }
    .btn.loading .btn-icon { display: none; }

    /* Smart Rating Toast/Card */
    .rating-toast {
      background: rgba(234, 179, 8, 0.08);
      border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: 10px;
      padding: 10px 12px;
      animation: fadeIn 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rating-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rating-label {
      font-size: 11px;
      font-weight: 700;
      color: #fde047;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
      line-height: 1;
    }
    .close-btn:hover { color: #fff; }

    .rating-msg {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.35;
    }

    .btn-rate {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #0b0f19;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-rate:hover {
      background: #facc15;
      color: #000;
    }

    /* Progress UI */
    .progress-container {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      animation: fadeIn 0.3s ease;
    }

    .progress-text {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-top: 2px;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer a:hover { color: #38bdf8; }
    .footer a.star { color: #facc15; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="shell">
    
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
        </div>
        <div class="app-title">Coursera Skip</div>
      </div>

      <div class="header-controls">
        <button id="btn-lang-toggle" class="lang-pill" title="Switch Language / Đổi ngôn ngữ">
          <span>🌐</span>
          <span id="txt-lang-badge" class="active-text">VI</span>
        </button>
      </div>
    </div>

    <!-- Alert Banner -->
    <div id="result-alert" class="alert"></div>

    <!-- State 1: Active Lesson Detected -->
    <div id="page-status" class="card" style="display: none;">
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span id="txt-detected-label">Lesson Detected</span>
      </div>
      <div class="course-title" id="lbl-course">--</div>
      <div class="lesson-meta">
        <span class="meta-label" id="txt-lesson-type-label">Lesson Type</span>
        <span class="type-pill" id="lbl-type">
          <span id="lbl-type-icon">🎬</span>
          <span id="lbl-type-text">Lecture (Video)</span>
        </span>
      </div>
    </div>

    <!-- State 2: Clean & Friendly Empty State -->
    <div id="empty-msg" class="empty-card" style="display: none;">
      <div class="empty-icon">🎓</div>
      <div class="empty-title" id="txt-empty-title">Ready to Automate</div>
      <div class="empty-desc" id="txt-empty-desc">Open any video or reading lesson on Coursera to start.</div>
      <button id="btn-guide-action" class="btn btn-outline">
        <span id="txt-guide-action-btn">🚀 Open Coursera</span>
      </button>
    </div>

    <!-- Action Buttons -->
    <div class="actions" id="action-buttons" style="display: none;">
      <button id="btn-skip-current" class="btn btn-primary">
        <span class="btn-icon">⚡</span>
        <div class="spinner"></div>
        <span class="btn-text" id="txt-btn-skip-current">Complete Current Lesson</span>
      </button>

      <button id="btn-skip-all" class="btn btn-magic">
        <span class="btn-icon">🚀</span>
        <div class="spinner"></div>
        <span class="btn-text" id="txt-btn-skip-all">Complete Entire Course</span>
      </button>
    </div>

    <!-- Progress UI -->
    <div id="bulk-progress-container" class="progress-container">
      <div class="progress-text">
        <span id="bulk-progress-msg">Initializing...</span>
        <span id="bulk-progress-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="bulk-progress-bar" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Gentle Rating Prompt (Only shown when lesson finishes successfully) -->
    <div id="rating-toast" class="rating-toast" style="display: none;">
      <div class="rating-top">
        <span class="rating-label" id="txt-rating-label">🎉 Completed!</span>
        <button id="btn-close-rating" class="close-btn" title="Close">✕</button>
      </div>
      <div class="rating-msg" id="txt-rating-msg">Saved your time? Give us 5 stars on Chrome Web Store!</div>
      <button id="btn-rate-store" class="btn-rate">
        <span>⭐ Rate 5 Stars</span>
      </button>
    </div>

    <!-- Minimal Footer -->
    <div class="footer">
      <span>Open Source</span>
      <span>•</span>
      <a href="https://github.com/tuankiet18-dev/coursera-skip-tool" target="_blank">GitHub</a>
      <span>•</span>
      <a id="lnk-footer-rate" href="#" class="star">⭐ Rate 5★</a>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
